<!DOCTYPE html>
<html lang="{{ lang|default('en') }}" dir="{{ dir|default('ltr') }}" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}System Makers{% endblock %} · {{ site_settings.company_name if site_settings else 'System Makers' }}</title>
<meta name="description" content="{% block meta_desc %}Submit your project, get a quotation, and track progress with System Makers — the modern client request & project management platform.{% endblock %}">
<link rel="icon" type="image/png" href="{{ url_for('static', filename='images/brand/logo_64.png') }}">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
{% if lang == 'ar' %}
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800&family=Tajawal:wght@400;500;700&display=swap">
{% endif %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
{% block extra_css %}{% endblock %}
</head>
<body>

{% block body %}{% endblock %}

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
  <div style="display:none">
    {% for category, message in messages %}
      <div data-flash="{{ message }}" data-category="{{ category }}"></div>
    {% endfor %}
  </div>
  {% endif %}
{% endwith %}
{% block extra_js %}{% endblock %}
</body>
</html>
