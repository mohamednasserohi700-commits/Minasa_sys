{% extends "base.html" %}
{% block body %}
<div class="auth-wrap" style="position:relative; overflow:hidden;">
  <div class="blob float-anim-slow" style="width:400px;height:400px;background:var(--accent-indigo); top:-120px; left:-100px;"></div>
  <div class="blob float-anim" style="width:340px;height:340px;background:var(--accent-cyan); bottom:-100px; right:-100px;"></div>

  <div style="position:absolute; top:24px; right:24px; z-index:2; display:flex; gap:8px;">
    <a href="{{ url_for('main.set_language', lang_code='ar' if lang == 'en' else 'en') }}" class="theme-toggle lang-toggle" style="width:auto; padding:0 12px; font-size:.82rem; font-weight:700;" title="Switch language">
      {{ t('lang_switch') }}
    </a>
    <button class="theme-toggle" data-theme-toggle>
      <i class="bi bi-sun-fill" data-theme-icon></i>
    </button>
  </div>

  <div style="position:relative; z-index:1; width:100%; display:flex; flex-direction:column; align-items:center;">
    <a href="{{ url_for('main.home') }}" class="brand" style="margin-bottom:28px; font-size:1.4rem;">
      <span class="brand-mark" style="background:transparent; box-shadow:none;"><img src="{{ url_for('static', filename='images/brand/logo_256.png') }}" alt="System Makers" style="width:100%;height:100%;object-fit:contain;"></span> System Makers
    </a>
    <div class="glass-strong auth-card">
      {% block auth_content %}{% endblock %}
    </div>
  </div>
</div>
{% endblock %}
