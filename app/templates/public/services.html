{% extends "layout_public.html" %}
{% block title %}Services{% endblock %}
{% block content %}
<section class="section">
  <div class="container-xl">
    <div style="text-align:center; margin-bottom:52px;" class="reveal">
      <div class="eyebrow" style="margin-left:auto;margin-right:auto;"><i class="bi bi-grid-1x2"></i> {{ t('services_eyebrow') }}</div>
      <h1 class="section-title">{{ t('services_page_title') }}</h1>
    </div>
    <div class="grid-3 reveal">
      {% for s in services %}
      <div class="glass card-hover" style="padding:1.8rem;">
        <div class="icon-box"><i class="bi {{ s.icon }}"></i></div>
        <h5 style="margin-bottom:8px;">{{ s.title }}</h5>
        <p class="text-muted-2" style="font-size:.89rem; line-height:1.6; margin:0 0 16px;">{{ s.description }}</p>
        <a href="{{ url_for('main.project_request') }}" class="btn btn-outline btn-sm">{{ t('request_this_service') }}</a>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
{% endblock %}
